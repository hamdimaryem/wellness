<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFBF0"/>
      <stop offset="100%" stop-color="#FDE8B0"/>
    </linearGradient>
    <radialGradient id="warmglow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#FFF8D6" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFBF0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF3D0"/>
      <stop offset="50%" stop-color="#FFFEF8"/>
      <stop offset="100%" stop-color="#F5DFA0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#warmglow)"/>
  <rect x="0" y="440" width="800" height="160" fill="#FDE8B0" opacity="0.4"/>
  <!-- orange blossom flowers -->
  <g opacity="0.9">
    <g transform="translate(170,350)">
      <circle cx="0" cy="-18" r="8" fill="white"/>
      <circle cx="17" cy="-6" r="8" fill="white"/>
      <circle cx="11" cy="13" r="8" fill="white"/>
      <circle cx="-11" cy="13" r="8" fill="white"/>
      <circle cx="-17" cy="-6" r="8" fill="white"/>
      <circle cx="0" cy="0" r="6" fill="#FFD54F"/>
    </g>
    <g transform="translate(620,360)">
      <circle cx="0" cy="-18" r="8" fill="white"/>
      <circle cx="17" cy="-6" r="8" fill="white"/>
      <circle cx="11" cy="13" r="8" fill="white"/>
      <circle cx="-11" cy="13" r="8" fill="white"/>
      <circle cx="-17" cy="-6" r="8" fill="white"/>
      <circle cx="0" cy="0" r="6" fill="#FFD54F"/>
    </g>
    <g transform="translate(200,450)">
      <circle cx="0" cy="-14" r="6" fill="white"/>
      <circle cx="13" cy="-4" r="6" fill="white"/>
      <circle cx="8" cy="10" r="6" fill="white"/>
      <circle cx="-8" cy="10" r="6" fill="white"/>
      <circle cx="-13" cy="-4" r="6" fill="white"/>
      <circle cx="0" cy="0" r="4" fill="#FFC107"/>
    </g>
    <g transform="translate(590,460)">
      <circle cx="0" cy="-14" r="6" fill="white"/>
      <circle cx="13" cy="-4" r="6" fill="white"/>
      <circle cx="8" cy="10" r="6" fill="white"/>
      <circle cx="-8" cy="10" r="6" fill="white"/>
      <circle cx="-13" cy="-4" r="6" fill="white"/>
      <circle cx="0" cy="0" r="4" fill="#FFC107"/>
    </g>
    <!-- leaves -->
    <ellipse cx="140" cy="370" rx="22" ry="10" fill="#4CAF50" transform="rotate(-30,140,370)" opacity="0.7"/>
    <ellipse cx="645" cy="375" rx="22" ry="10" fill="#4CAF50" transform="rotate(25,645,375)" opacity="0.7"/>
  </g>
  <!-- cylindrical jar candle -->
  <rect x="330" y="270" width="140" height="180" rx="12" fill="url(#jar)" stroke="#F5DFA0" stroke-width="1.5"/>
  <ellipse cx="400" cy="278" rx="66" ry="12" fill="#FFFEF8"/>
  <rect x="398" y="228" width="4" height="44" rx="2" fill="#4E342E"/>
  <!-- flame -->
  <ellipse cx="400" cy="216" rx="9" ry="16" fill="#FF8F00" opacity="0.95"/>
  <ellipse cx="400" cy="220" rx="5" ry="9" fill="#FFEB3B"/>
  <ellipse cx="400" cy="224" rx="3" ry="4" fill="white" opacity="0.55"/>
  <ellipse cx="400" cy="220" rx="28" ry="36" fill="#FFF8E1" opacity="0.28"/>
  <!-- label -->
  <rect x="344" y="308" width="112" height="80" rx="5" fill="white" opacity="0.88"/>
  <text x="400" y="330" text-anchor="middle" font-size="9" fill="#7D4E00" font-weight="bold" letter-spacing="1.5">FLEUR D'ORANGER</text>
  <text x="400" y="347" text-anchor="middle" font-size="7.5" fill="#E65100" letter-spacing="1">BOUGIE SOJA</text>
  <line x1="358" y1="355" x2="442" y2="355" stroke="#F5DFA0" stroke-width="0.5"/>
  <text x="400" y="371" text-anchor="middle" font-size="7" fill="#FFA000">NATURELLE · 180g</text>
  <rect x="342" y="282" width="12" height="150" rx="6" fill="white" opacity="0.22"/>
  <text x="400" y="556" text-anchor="middle" font-size="18" fill="#7D4E00" letter-spacing="3" font-style="italic">Bougie Soja · Fleur d'Oranger</text>
</svg>
