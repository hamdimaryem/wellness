  <line x1="200" y1="335" x2="200" y2="425" stroke="#F9A825" stroke-width="1.5"/>
  <line x1="155" y1="380" x2="245" y2="380" stroke="#F9A825" stroke-width="1.5"/>
  <line x1="168" y1="347" x2="232" y2="413" stroke="#F9A825" stroke-width="1"/>
  <line x1="168" y1="413" x2="232" y2="347" stroke="#F9A825" stroke-width="1"/>
  <!-- strawberries right -->
  <path d="M580 350 Q595 330 610 350 Q615 375 595 385 Q575 375 580 350 Z" fill="#E53935"/>
  <path d="M608 350 Q623 330 638 350 Q643 375 623 385 Q603 375 608 350 Z" fill="#EF5350"/>
  <ellipse cx="595" cy="330" rx="8" ry="4" fill="#4CAF50"/>
  <ellipse cx="623" cy="330" rx="8" ry="4" fill="#388E3C"/>
  <!-- seeds on strawberry -->
  <ellipse cx="595" cy="358" rx="2" ry="3" fill="#FFCDD2" opacity="0.7"/>
  <ellipse cx="588" cy="368" rx="2" ry="3" fill="#FFCDD2" opacity="0.7"/>
  <ellipse cx="603" cy="368" rx="2" ry="3" fill="#FFCDD2" opacity="0.7"/>
