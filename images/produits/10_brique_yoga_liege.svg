<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F5F0E8"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D4C4A0"/>
      <stop offset="100%" stop-color="#B8A478"/>
    </linearGradient>
    <linearGradient id="cork_top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#C8A870"/>
      <stop offset="100%" stop-color="#A8844A"/>
    </linearGradient>
    <linearGradient id="cork_side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B8944A"/>
      <stop offset="100%" stop-color="#8C6A28"/>
    </linearGradient>
    <linearGradient id="cork_front" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C0984C"/>
      <stop offset="100%" stop-color="#9C7A30"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- studio light from side -->
  <rect x="600" y="0" width="200" height="600" fill="#FFFDE7" opacity="0.08"/>
  <!-- floor -->
  <rect x="0" y="360" width="800" height="240" fill="url(#floor)"/>
  <line x1="0" y1="395" x2="800" y2="395" stroke="#9C8050" stroke-width="0.7" opacity="0.35"/>
  <line x1="0" y1="435" x2="800" y2="435" stroke="#9C8050" stroke-width="0.7" opacity="0.35"/>
  <!-- yoga mat beneath block -->
  <path d="M150 350 L650 350 L650 500 L150 500 Z" fill="#E8D4B8" opacity="0.5" rx="10"/>
  <!-- cork block 3D isometric -->
  <!-- top face -->
  <path d="M260 200 L540 200 L540 300 L260 300 Z" fill="url(#cork_top)"/>
  <!-- cork texture top -->
  <g opacity="0.15" fill="#7A5020">
    <rect x="280" y="215" width="40" height="6" rx="2"/>
    <rect x="340" y="225" width="55" height="5" rx="2"/>
    <rect x="280" y="238" width="35" height="5" rx="2"/>
    <rect x="330" y="248" width="50" height="6" rx="2"/>
    <rect x="280" y="262" width="45" height="5" rx="2"/>
    <rect x="340" y="275" width="40" height="5" rx="2"/>
    <rect x="430" y="215" width="40" height="6" rx="2"/>
    <rect x="460" y="240" width="35" height="5" rx="2"/>
    <rect x="420" y="265" width="50" height="5" rx="2"/>
  </g>
  <!-- front face -->
  <path d="M260 300 L540 300 L540 400 L260 400 Z" fill="url(#cork_front)"/>
  <g opacity="0.1" fill="#5A3810">
    <rect x="275" y="315" width="60" height="8" rx="2"/>
    <rect x="350" y="330" width="80" height="7" rx="2"/>
    <rect x="275" y="350" width="70" height="7" rx="2"/>
    <rect x="360" y="368" width="65" height="7" rx="2"/>
    <rect x="275" y="385" width="55" height="7" rx="2"/>
  </g>
  <!-- right face (shadow side) -->
  <path d="M540 200 L620 240 L620 340 L540 300 Z" fill="url(#cork_side)"/>
  <!-- bottom edge -->
  <path d="M260 400 L540 400 L620 340 L620 340" fill="#7A5020" opacity="0.3"/>
  <!-- brand line on front -->
  <line x1="275" y1="310" x2="525" y2="310" stroke="#C8A870" stroke-width="0.5" opacity="0.5"/>
  <text x="400" y="308" text-anchor="middle" font-size="9" fill="#FDECD0" letter-spacing="3" opacity="0.7">YOGA BLOC · LIÈGE NATUREL</text>
  <!-- shadow -->
  <ellipse cx="400" cy="408" rx="150" ry="15" fill="#9C8050" opacity="0.25"/>
  <text x="400" y="558" text-anchor="middle" font-size="18" fill="#5C3D10" letter-spacing="3" font-style="italic">Brique de Yoga · Liège Naturel</text>
</svg>
