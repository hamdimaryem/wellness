<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAFAF5"/>
      <stop offset="100%" stop-color="#F0EDE0"/>
    </linearGradient>
    <linearGradient id="table" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C8A87A"/>
      <stop offset="100%" stop-color="#A0804A"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2C3E50"/>
      <stop offset="100%" stop-color="#1A252F"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- window light -->
  <rect x="550" y="0" width="250" height="600" fill="#FFFDE7" opacity="0.1"/>
  <!-- table surface -->
  <rect x="0" y="340" width="800" height="260" fill="url(#table)"/>
  <line x1="0" y1="370" x2="800" y2="370" stroke="#8B6A3A" stroke-width="0.6" opacity="0.3"/>
  <line x1="0" y1="400" x2="800" y2="400" stroke="#8B6A3A" stroke-width="0.6" opacity="0.3"/>
  <!-- small plant left -->
  <rect x="80" y="290" width="55" height="55" rx="6" fill="#795548"/>
  <ellipse cx="107" cy="288" rx="32" ry="9" fill="#6D4C41"/>
  <path d="M107 265 Q92 240 78 218" stroke="#388E3C" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M107 265 Q120 238 136 215" stroke="#2E7D32" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="78" cy="216" rx="18" ry="10" fill="#4CAF50" transform="rotate(-20,78,216)"/>
  <ellipse cx="136" cy="213" rx="18" ry="10" fill="#388E3C" transform="rotate(25,136,213)"/>
  <!-- notebook open - left page -->
  <rect x="200" y="160" width="210" height="270" rx="4" fill="#1A252F"/>
  <rect x="205" y="165" width="200" height="260" rx="2" fill="#FFFDE7"/>
  <!-- left page content (diary lines) -->
  <g stroke="#D4C8A0" stroke-width="1" opacity="0.7">
    <line x1="225" y1="210" x2="395" y2="210"/>
    <line x1="225" y1="230" x2="395" y2="230"/>
    <line x1="225" y1="250" x2="395" y2="250"/>
    <line x1="225" y1="270" x2="395" y2="270"/>
    <line x1="225" y1="290" x2="395" y2="290"/>
    <line x1="225" y1="310" x2="395" y2="310"/>
    <line x1="225" y1="330" x2="360" y2="330"/>
    <line x1="225" y1="350" x2="375" y2="350"/>
    <line x1="225" y1="370" x2="390" y2="370"/>
    <line x1="225" y1="390" x2="340" y2="390"/>
  </g>
  <text x="305" y="200" text-anchor="middle" font-size="11" fill="#8B7355" font-style="italic">Mon Rituel</text>
  <!-- right page -->
  <rect x="410" y="160" width="210" height="270" rx="4" fill="url(#cover)"/>
  <!-- cover design -->
  <rect x="420" y="172" width="190" height="246" rx="3" fill="none" stroke="#3D5A6E" stroke-width="1.5"/>
  <text x="515" y="265" text-anchor="middle" font-size="14" fill="#C8A870" letter-spacing="3" font-weight="bold">RITUEL</text>
  <text x="515" y="285" text-anchor="middle" font-size="9" fill="#8B9BAA" letter-spacing="2">BIEN-ÊTRE</text>
  <line x1="455" y1="295" x2="575" y2="295" stroke="#3D5A6E" stroke-width="0.5"/>
  <text x="515" y="315" text-anchor="middle" font-size="8" fill="#6B7B8A" letter-spacing="1">2025</text>
  <!-- spine -->
  <rect x="408" y="160" width="6" height="270" fill="#0F1923"/>
  <!-- pen -->
  <rect x="440" y="445" width="10" height="120" rx="5" fill="#2C3E50" transform="rotate(-15,440,445)"/>
  <rect x="438" y="440" width="14" height="20" rx="3" fill="#FFD700" transform="rotate(-15,440,445)"/>
  <polygon points="440,560 450,560 445,580" fill="#C0C0C0" transform="rotate(-15,440,560)"/>
  <!-- small plant right -->
  <rect x="650" y="300" width="55" height="50" rx="6" fill="#5D4037"/>
  <ellipse cx="677" cy="298" rx="32" ry="9" fill="#4E342E"/>
  <path d="M677 278 Q658 255 642 232" stroke="#558B2F" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M677 278 Q695 254 710 230" stroke="#33691E" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="642" cy="230" rx="16" ry="9" fill="#8BC34A" transform="rotate(-25,642,230)"/>
  <ellipse cx="710" cy="228" rx="16" ry="9" fill="#558B2F" transform="rotate(20,710,228)"/>
  <text x="400" y="558" text-anchor="middle" font-size="18" fill="#2C3E50" letter-spacing="3" font-style="italic">Carnet · Rituel Bien-Être</text>
</svg>
