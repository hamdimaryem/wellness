<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D5F0"/>
      <stop offset="100%" stop-color="#C9A8E0"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7B4FA6"/>
      <stop offset="100%" stop-color="#4A2070"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F5EEF8"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7BDE2"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B59B6"/>
      <stop offset="100%" stop-color="#6C3483"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#sky)"/>
  <!-- lavender field rows -->
  <rect x="0" y="380" width="800" height="220" fill="url(#field)" opacity="0.9"/>
  <ellipse cx="400" cy="380" rx="400" ry="30" fill="#9B59B6" opacity="0.4"/>
  <!-- field stems -->
  <g opacity="0.6">
    <rect x="40" y="330" width="3" height="60" fill="#5D2E8C"/>
    <rect x="80" y="320" width="3" height="70" fill="#5D2E8C"/>
    <rect x="120" y="335" width="3" height="55" fill="#5D2E8C"/>
    <rect x="160" y="325" width="3" height="65" fill="#5D2E8C"/>
    <rect x="200" y="330" width="3" height="60" fill="#5D2E8C"/>
    <rect x="580" y="330" width="3" height="60" fill="#5D2E8C"/>
    <rect x="620" y="320" width="3" height="70" fill="#5D2E8C"/>
    <rect x="660" y="335" width="3" height="55" fill="#5D2E8C"/>
    <rect x="700" y="325" width="3" height="65" fill="#5D2E8C"/>
    <rect x="740" y="330" width="3" height="60" fill="#5D2E8C"/>
  </g>
  <!-- flower clusters -->
  <g>
    <ellipse cx="40" cy="325" rx="6" ry="14" fill="#B57EDC"/>
    <ellipse cx="80" cy="315" rx="6" ry="14" fill="#A569C9"/>
    <ellipse cx="120" cy="330" rx="6" ry="14" fill="#B57EDC"/>
    <ellipse cx="160" cy="320" rx="6" ry="14" fill="#9B59B6"/>
    <ellipse cx="200" cy="325" rx="6" ry="14" fill="#A569C9"/>
    <ellipse cx="580" cy="325" rx="6" ry="14" fill="#B57EDC"/>
    <ellipse cx="620" cy="315" rx="6" ry="14" fill="#A569C9"/>
    <ellipse cx="660" cy="330" rx="6" ry="14" fill="#B57EDC"/>
    <ellipse cx="700" cy="320" rx="6" ry="14" fill="#9B59B6"/>
    <ellipse cx="740" cy="325" rx="6" ry="14" fill="#A569C9"/>
  </g>
  <!-- bottle body -->
  <rect x="330" y="130" width="140" height="260" rx="16" fill="url(#bottle)" stroke="#D2B4DE" stroke-width="1.5"/>
  <!-- liquid inside -->
  <rect x="336" y="200" width="128" height="185" rx="10" fill="url(#liquid)" opacity="0.75"/>
  <!-- bottle neck -->
  <rect x="365" y="100" width="70" height="38" rx="8" fill="#E8D5F0" stroke="#C39BD3" stroke-width="1"/>
  <!-- cap -->
  <rect x="358" y="78" width="84" height="28" rx="10" fill="#6C3483"/>
  <!-- dropper tip -->
  <rect x="392" y="58" width="16" height="24" rx="4" fill="#5D2E8C"/>
  <!-- label -->
  <rect x="345" y="215" width="110" height="80" rx="6" fill="white" opacity="0.9"/>
  <text x="400" y="238" text-anchor="middle" font-size="11" fill="#6C3483" font-weight="bold" letter-spacing="2">LAVANDE</text>
  <text x="400" y="256" text-anchor="middle" font-size="9" fill="#9B59B6" letter-spacing="1">HUILE ESSENTIELLE</text>
  <line x1="360" y1="265" x2="440" y2="265" stroke="#D2B4DE" stroke-width="0.5"/>
  <text x="400" y="282" text-anchor="middle" font-size="8" fill="#ADA" fill="#B8860B">100% PURE</text>
  <!-- soft highlight on bottle -->
  <rect x="345" y="140" width="18" height="220" rx="9" fill="white" opacity="0.3"/>
  <!-- light rays -->
  <line x1="400" y1="0" x2="350" y2="80" stroke="white" stroke-width="0.5" opacity="0.3"/>
  <line x1="500" y1="0" x2="450" y2="80" stroke="white" stroke-width="0.5" opacity="0.3"/>
  <!-- product name -->
  <text x="400" y="550" text-anchor="middle" font-size="18" fill="#4A2070" letter-spacing="3" font-style="italic">Huile Essentielle · Lavande</text>
</svg>
