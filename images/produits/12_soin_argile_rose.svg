<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDF0F5"/>
      <stop offset="100%" stop-color="#F8DCE8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#FFF0F5" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FDF0F5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="jar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F8E8F2"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0D8EA"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4A7C0"/>
      <stop offset="100%" stop-color="#E07095"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- light table surface -->
  <rect x="0" y="400" width="800" height="200" fill="#F5E0EC" opacity="0.4"/>
  <!-- rose petals scattered -->
  <g opacity="0.8">
    <ellipse cx="140" cy="380" rx="28" ry="16" fill="#E91E8C" transform="rotate(-30,140,380)"/>
    <ellipse cx="180" cy="420" rx="22" ry="13" fill="#F48FB1" transform="rotate(15,180,420)"/>
    <ellipse cx="120" cy="440" rx="25" ry="14" fill="#CE1483" transform="rotate(45,120,440)"/>
    <ellipse cx="620" cy="395" rx="28" ry="16" fill="#E91E8C" transform="rotate(25,620,395)"/>
    <ellipse cx="660" cy="430" rx="22" ry="13" fill="#F06292" transform="rotate(-10,660,430)"/>
    <ellipse cx="640" cy="460" rx="25" ry="14" fill="#CE1483" transform="rotate(-45,640,460)"/>
    <ellipse cx="310" cy="460" rx="18" ry="11" fill="#F48FB1" transform="rotate(10,310,460)"/>
    <ellipse cx="490" cy="455" rx="18" ry="11" fill="#AD1457" transform="rotate(-25,490,455)"/>
    <!-- small pink dots -->
    <circle cx="250" cy="430" r="8" fill="#F8BBD9"/>
    <circle cx="540" cy="440" r="8" fill="#F8BBD9"/>
    <circle cx="380" cy="490" r="6" fill="#F48FB1"/>
  </g>
  <!-- face silhouette (abstract) -->
  <ellipse cx="400" cy="250" rx="90" ry="110" fill="#F5C4B8" opacity="0.35"/>
  <!-- clay mask texture on face area -->
  <ellipse cx="400" cy="255" rx="82" ry="95" fill="#F4A7C0" opacity="0.55"/>
  <ellipse cx="400" cy="240" rx="78" ry="75" fill="#F0C4D4" opacity="0.4"/>
  <!-- product jar -->
  <rect x="540" y="260" width="130" height="140" rx="14" fill="url(#jar)" stroke="#F0C4D4" stroke-width="1.5"/>
  <!-- clay inside -->
  <rect x="546" y="290" width="118" height="106" rx="8" fill="url(#clay)" opacity="0.75"/>
  <!-- jar top rim -->
  <ellipse cx="605" cy="272" rx="62" ry="16" fill="#F8E8F2" stroke="#F0C4D4" stroke-width="1"/>
  <ellipse cx="605" cy="268" rx="58" ry="12" fill="#FDFBFF"/>
  <!-- lid off to side -->
  <ellipse cx="700" cy="230" rx="58" ry="20" fill="#C2185B" stroke="#880E4F" stroke-width="1.5"/>
  <ellipse cx="700" cy="222" rx="54" ry="16" fill="#D81B60"/>
  <!-- label -->
  <rect x="555" y="298" width="100" height="62" rx="5" fill="white" opacity="0.9"/>
  <text x="605" y="318" text-anchor="middle" font-size="9" fill="#880E4F" font-weight="bold" letter-spacing="1.5">ARGILE ROSE</text>
  <text x="605" y="334" text-anchor="middle" font-size="7.5" fill="#C2185B" letter-spacing="1">MASQUE VISAGE</text>
  <line x1="564" y1="342" x2="646" y2="342" stroke="#F8BBD9" stroke-width="0.5"/>
  <text x="605" y="354" text-anchor="middle" font-size="7" fill="#E91E8C">100% NATUREL</text>
  <!-- shine on jar -->
  <rect x="554" y="276" width="12" height="110" rx="6" fill="white" opacity="0.25"/>
  <text x="400" y="558" text-anchor="middle" font-size="18" fill="#880E4F" letter-spacing="3" font-style="italic">Soin Visage · Argile Rose</text>
</svg>
