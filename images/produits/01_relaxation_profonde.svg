  <path d="M578 412 Q582 416 586 412" fill="none" stroke="#8D4E35" stroke-width="2" stroke-linecap="round"/>
  <path d="M574 408 Q578 406 582 408" fill="none" stroke="#8D4E35" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M587 408 Q591 406 595 408" fill="none" stroke="#8D4E35" stroke-width="1.5" stroke-linecap="round"/>
  <text x="400" y="556" text-anchor="middle" font-size="18" fill="#1B5E20" letter-spacing="3" font-style="italic">Coaching · Relaxation Profonde</text>
