<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FAF5"/>
      <stop offset="100%" stop-color="#E0F0EA"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#FFFDE7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#F0FAF5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <!-- window light -->
  <rect x="600" y="0" width="200" height="600" fill="#FFFDE7" opacity="0.12"/>
  <!-- plants left -->
  <rect x="60" y="310" width="60" height="75" rx="8" fill="#795548"/>
