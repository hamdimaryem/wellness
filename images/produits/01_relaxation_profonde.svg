  <rect x="132" y="382" width="536" height="86" rx="6" fill="none" stroke="#81C784" stroke-width="1.5" opacity="0.4"/>
  <!-- person lying down (simplified silhouette) -->
  <!-- body -->
  <ellipse cx="400" cy="415" rx="200" ry="28" fill="#FDBCB4" opacity="0.9"/>
  <!-- head -->
  <ellipse cx="590" cy="408" rx="36" ry="32" fill="#FDBCB4"/>
