  <ellipse cx="130" cy="221" rx="20" ry="11" fill="#388E3C" transform="rotate(20,130,221)"/>
  <!-- plants right -->
  <rect x="660" y="300" width="60" height="85" rx="8" fill="#5D4037"/>
