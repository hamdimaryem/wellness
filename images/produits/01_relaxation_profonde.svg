  <path d="M690 275 Q708 247 725 216" stroke="#33691E" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <ellipse cx="655" cy="216" rx="18" ry="10" fill="#8BC34A" transform="rotate(-20,655,216)"/>
  <ellipse cx="725" cy="214" rx="18" ry="10" fill="#558B2F" transform="rotate(15,725,214)"/>
