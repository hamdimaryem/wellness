<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1235"/>
      <stop offset="100%" stop-color="#0D0820"/>
    </linearGradient>
    <radialGradient id="lampglow" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#8B7AD4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1A1235" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2D2550"/>
      <stop offset="50%" stop-color="#4A3F80"/>
      <stop offset="100%" stop-color="#2D2550"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#lampglow)"/>
  <!-- stars -->
  <circle cx="100" cy="60" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="200" cy="40" r="1" fill="white" opacity="0.5"/>
  <circle cx="600" cy="50" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="700" cy="80" r="1" fill="white" opacity="0.5"/>
  <circle cx="150" cy="120" r="1" fill="white" opacity="0.4"/>
  <circle cx="650" cy="100" r="1" fill="white" opacity="0.4"/>
  <circle cx="350" cy="30" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="500" cy="70" r="1" fill="white" opacity="0.5"/>
  <!-- moon -->
  <circle cx="660" cy="90" r="35" fill="#C5B8F0" opacity="0.3"/>
  <circle cx="675" cy="80" r="30" fill="#1A1235" opacity="0.8"/>
  <!-- table surface -->
  <rect x="0" y="430" width="800" height="170" fill="#120E28"/>
  <!-- chamomile flowers -->
  <g opacity="0.7">
    <g transform="translate(180,400)">
      <circle cx="0" cy="-14" r="7" fill="#FFFDE7"/>
      <circle cx="13" cy="-4" r="7" fill="#FFFDE7"/>
      <circle cx="8" cy="10" r="7" fill="#FFFDE7"/>
      <circle cx="-8" cy="10" r="7" fill="#FFFDE7"/>
      <circle cx="-13" cy="-4" r="7" fill="#FFFDE7"/>
      <circle cx="0" cy="0" r="7" fill="#F9A825"/>
    </g>
    <g transform="translate(590,415)">
      <circle cx="0" cy="-12" r="6" fill="#FFFDE7"/>
      <circle cx="11" cy="-3" r="6" fill="#FFFDE7"/>
      <circle cx="7" cy="9" r="6" fill="#FFFDE7"/>
      <circle cx="-7" cy="9" r="6" fill="#FFFDE7"/>
      <circle cx="-11" cy="-3" r="6" fill="#FFFDE7"/>
      <circle cx="0" cy="0" r="6" fill="#FFC107"/>
    </g>
    <!-- lavender sprigs -->
    <rect x="250" y="380" width="3" height="60" fill="#7B68EE" rx="1"/>
    <ellipse cx="251" cy="370" rx="5" ry="12" fill="#9575CD"/>
    <rect x="540" y="390" width="3" height="50" fill="#7B68EE" rx="1"/>
    <ellipse cx="541" cy="380" rx="5" ry="12" fill="#9575CD"/>
  </g>
  <!-- cup -->
  <path d="M330 310 L340 470 L460 470 L470 310 Z" rx="10" fill="url(#cup)" stroke="#6B5EAE" stroke-width="1.5"/>
  <ellipse cx="400" cy="310" rx="72" ry="18" fill="#3D3470"/>
  <!-- tea surface -->
  <ellipse cx="400" cy="316" rx="68" ry="14" fill="#2A1F50"/>
  <!-- steam -->
  <g opacity="0.5" fill="none" stroke="#B0A8E0" stroke-width="2" stroke-linecap="round">
    <path d="M375 295 Q368 270 375 248 Q382 226 375 210"/>
    <path d="M400 288 Q393 262 400 238 Q407 214 400 198"/>
    <path d="M425 295 Q432 270 425 248 Q418 226 425 210"/>
  </g>
  <!-- saucer -->
  <ellipse cx="400" cy="475" rx="90" ry="16" fill="#252048" stroke="#6B5EAE" stroke-width="1"/>
  <!-- handle -->
  <path d="M468 360 Q510 360 510 390 Q510 420 468 420" fill="none" stroke="#6B5EAE" stroke-width="10" stroke-linecap="round"/>
  <text x="400" y="558" text-anchor="middle" font-size="18" fill="#C5B8F0" letter-spacing="3" font-style="italic">Tisane · Nuit Paisible</text>
</svg>
