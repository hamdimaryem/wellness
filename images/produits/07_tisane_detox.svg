<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FFF4"/>
      <stop offset="100%" stop-color="#E0F5E8"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D4EFDF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#D4EFDF" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="tea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B3E5C8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7EC8A4" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <!-- background circles light -->
  <circle cx="200" cy="200" r="120" fill="#C8F5D8" opacity="0.2"/>
  <circle cx="620" cy="350" r="100" fill="#C8F5D8" opacity="0.15"/>
  <!-- lemon slices background -->
  <g opacity="0.25">
    <circle cx="130" cy="450" r="50" fill="#FFF176" stroke="#F9A825" stroke-width="2"/>
    <line x1="130" y1="400" x2="130" y2="500" stroke="#F9A825" stroke-width="1"/>
    <line x1="80" y1="450" x2="180" y2="450" stroke="#F9A825" stroke-width="1"/>
    <line x1="95" y1="415" x2="165" y2="485" stroke="#F9A825" stroke-width="1"/>
    <line x1="95" y1="485" x2="165" y2="415" stroke="#F9A825" stroke-width="1"/>
  </g>
  <!-- mint leaves -->
  <g opacity="0.8">
    <ellipse cx="160" cy="350" rx="30" ry="14" fill="#2ECC71" transform="rotate(-25,160,350)"/>
    <ellipse cx="190" cy="330" rx="28" ry="12" fill="#27AE60" transform="rotate(-40,190,330)"/>
    <ellipse cx="600" cy="340" rx="30" ry="14" fill="#2ECC71" transform="rotate(20,600,340)"/>
    <ellipse cx="570" cy="360" rx="28" ry="12" fill="#27AE60" transform="rotate(35,570,360)"/>
    <!-- veins -->
    <line x1="145" y1="355" x2="172" y2="346" stroke="#27AE60" stroke-width="0.8" opacity="0.5"/>
    <line x1="174" y1="335" x2="202" y2="326" stroke="#27AE60" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- tall glass -->
  <path d="M330 180 L320 480 L480 480 L470 180 Z" fill="url(#glass)" stroke="#A8D8B8" stroke-width="1.5"/>
  <!-- tea fill -->
  <path d="M324 300 L318 480 L482 480 L476 300 Z" fill="url(#tea)"/>
  <!-- lemon slice on glass edge -->
  <circle cx="475" cy="290" r="32" fill="#FFF176" stroke="#F9A825" stroke-width="2"/>
  <circle cx="475" cy="290" r="24" fill="#FFF9C4"/>
  <line x1="475" y1="258" x2="475" y2="322" stroke="#F9A825" stroke-width="1"/>
  <line x1="443" y1="290" x2="507" y2="290" stroke="#F9A825" stroke-width="1"/>
  <line x1="452" y1="262" x2="498" y2="318" stroke="#F9A825" stroke-width="1"/>
  <line x1="452" y1="318" x2="498" y2="262" stroke="#F9A825" stroke-width="1"/>
  <!-- mint sprig in glass -->
  <rect x="400" y="180" width="3" height="130" fill="#27AE60" rx="1"/>
  <ellipse cx="395" cy="200" rx="18" ry="8" fill="#2ECC71" transform="rotate(-20,395,200)"/>
  <ellipse cx="408" cy="215" rx="18" ry="8" fill="#27AE60" transform="rotate(15,408,215)"/>
  <!-- ice cubes -->
  <rect x="345" y="380" width="40" height="40" rx="4" fill="white" opacity="0.5"/>
  <rect x="400" y="390" width="35" height="35" rx="4" fill="white" opacity="0.4"/>
  <rect x="440" y="375" width="38" height="38" rx="4" fill="white" opacity="0.45"/>
  <!-- glass shine -->
  <rect x="336" y="195" width="12" height="270" rx="6" fill="white" opacity="0.3"/>
  <text x="400" y="556" text-anchor="middle" font-size="18" fill="#1A6E3C" letter-spacing="3" font-style="italic">Tisane Detox · Menthe Citron</text>
</svg>
